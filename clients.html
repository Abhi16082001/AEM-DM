
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Client Management — Bill Creator</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/clients.js" defer></script>
</head>
<body>
  <div id="navbar"></div>

  <main class="app-container">
    <section class="page-heading">
      <p class="eyebrow">CLIENT DIRECTORY</p>
      <h1>Client Management</h1>
      <p class="subheading">Maintain client information for your bills.</p>
    </section>

    <section class="panel">
      <div class="panel-heading">
        <div>
          <h2 id="form-title">Add Client</h2>
          <p class="muted">Enter the client details below.</p>
        </div>
      </div>

      <form id="client-form">
        <div id="client-fields" class="form-grid"></div>

        <div class="form-actions">
          <button id="save-button" class="button button-primary" type="submit">
            Save Client
          </button>

          <button id="cancel-button"
                  class="button button-secondary"
                  type="button" hidden>
            Cancel Edit
          </button>
        </div>

        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel table-panel">
      <div class="panel-heading table-heading">
        <div>
          <h2>Clients</h2>
          <p class="muted">Your saved client records.</p>
        </div>
        <button id="refresh-button" class="button button-secondary" type="button">
          Refresh
        </button>
      </div>

      <p id="table-status" class="status" role="status" aria-live="polite"></p>

      <div class="table-wrapper">
        <table>
          <thead id="clients-head"></thead>
          <tbody id="clients-body"></tbody>
        </table>
      </div>
    </section>
  </main>

  <dialog id="client-dialog" class="detail-dialog">
    <div class="dialog-heading">
      <h2>Client Details</h2>
      <button id="close-dialog" class="icon-button"
              type="button" aria-label="Close dialog">×</button>
    </div>
    <div id="client-details" class="detail-list"></div>
  </dialog>
</body>
</html>
