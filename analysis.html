<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <link rel="icon" href="public/Earth.jpg" type="image/jpeg">
  <title>Analysis — Bill Creator</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/analysis.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="app-container">
    <section class="page-heading">
      <p class="eyebrow">ANALYSIS</p>
      <h1 id="page-title">Analyze Records</h1>
      <p id="page-subheading" class="subheading">Use any combination of filters to review saved records.</p>
    </section>
    <section class="panel">
      <div class="panel-heading"><div><h2>Filters</h2><p class="muted">All filters are optional. Analysis is read-only.</p></div></div>
      <form id="analysis-form">
        <div id="analysis-fields" class="form-grid"></div>
        <div class="form-actions">
          <button class="button button-primary" type="submit">Apply Filters</button>
          <button id="clear-button" class="button button-secondary" type="button">Clear Filters</button>
        </div>
        <p id="filter-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>
    <section class="panel table-panel">
      <div class="panel-heading table-heading"><div><h2 id="table-title">Results</h2><p class="muted">Matching saved records.</p></div><div class="table-actions"><button id="calculate-total-button" class="button button-secondary" type="button" hidden>Calculate Total</button><button id="download-button" class="button button-secondary" type="button" hidden>Download Excel</button><button id="refresh-button" class="button button-secondary" type="button">Refresh</button></div></div>
      <p id="table-status" class="status" role="status" aria-live="polite"></p>
      <p id="calculated-total" class="status" role="status" aria-live="polite"></p>
      <div class="table-wrapper"><table class="data-table" data-table-search="off"><thead id="records-head"></thead><tbody id="records-body"></tbody></table></div>
    </section>
  </main>
</body>
</html>
