<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Master Data — Bill Creator</title>
  <link rel="stylesheet" href="css/style.css">
  <script src="js/config.js" defer></script>
  <script src="js/common.js" defer></script>
  <script src="js/master-data.js" defer></script>
</head>
<body>
  <div id="navbar"></div>
  <main class="app-container">
    <section class="page-heading">
      <p class="eyebrow">MASTER DATA</p>
      <h1 id="page-title">Management</h1>
      <p id="page-subheading" class="subheading"></p>
    </section>

    <section class="panel">
      <div class="panel-heading"><div><h2 id="form-title">Add Record</h2><p class="muted">Enter the details below.</p></div></div>
      <form id="master-form">
        <div id="master-fields" class="form-grid"></div>
        <div class="form-actions">
          <button id="save-button" class="button button-primary" type="submit">Save</button>
          <button id="cancel-button" class="button button-secondary" type="button" hidden>Cancel Edit</button>
        </div>
        <p id="form-status" class="status" role="status" aria-live="polite"></p>
      </form>
    </section>

    <section class="panel table-panel">
      <div class="panel-heading table-heading"><div><h2 id="table-title">Records</h2><p class="muted">Your saved records.</p></div><button id="refresh-button" class="button button-secondary" type="button">Refresh</button></div>
      <p id="table-status" class="status" role="status" aria-live="polite"></p>
      <div class="table-wrapper"><table><thead id="records-head"></thead><tbody id="records-body"></tbody></table></div>
    </section>
  </main>

  <dialog id="record-dialog" class="detail-dialog">
    <div class="dialog-heading"><h2 id="dialog-title">Record Details</h2><button id="close-dialog" class="icon-button" type="button" aria-label="Close dialog">×</button></div>
    <div id="record-details" class="detail-list"></div>
  </dialog>
</body>
</html>
